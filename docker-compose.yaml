services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: mayacode_sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MayaCode2026#Sog1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./data:/data
      - ./sql:/sql
volumes:
  mssql_data: