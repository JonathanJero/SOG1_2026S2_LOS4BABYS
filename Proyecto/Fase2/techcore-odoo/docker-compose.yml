services:
  web:
    image: odoo:17.0
    container_name: techcore_odoo_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=techcore_secure_pwd
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./filestore:/var/lib/odoo/filestore
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    restart: always

  db:
    image: postgres:15
    container_name: techcore_postgres_db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=techcore_secure_pwd
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d TechCore_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: always

volumes:
  odoo-web-data:
  odoo-db-data:
